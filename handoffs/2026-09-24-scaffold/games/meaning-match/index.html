<!doctype html><meta charset="utf-8"><title>Jarvis · Meaning Match</title><style>body{background:#10192b;color:#edf4ff;font:18px system-ui;max-width:850px;margin:50px auto;padding:24px}h1{color:#90e9cc}.card{padding:25px;background:#1c2b42;border-radius:16px;margin:20px 0}button{padding:12px;background:#294b61;color:white;border:0;border-radius:8px}small{color:#aebed5}pre{white-space:pre-wrap;font:inherit}</style><h1>Meaning Match</h1><p>A little word game for Jarvis: understand the meaning, then answer naturally.</p><div class="card"><h2 id="phase">Starting…</h2><p id="progress"></p><pre id="round"></pre></div><button onclick="fetch('/stop',{method:'POST'})">Stop practice</button><p><small>24 rounds: baseline → feedback practice → new wording. Fictional examples stay out of personal memory. This is practice and remembered guidance, not model retraining.</small></p><script>async function refresh(){let s=await(await fetch('/state')).json();document.querySelector('#phase').textContent=s.phase;document.querySelector('#progress').textContent='Round '+s.round+'/24 · '+(s.waiting||s.error||(s.scores?JSON.stringify(s.scores):'Practicing'));let r=s.results.at(-1);document.querySelector('#round').textContent=r?r.scenario+'\n\n'+(r.correct?'✓ Correct meaning':'Try again: '+r.expected)+'\n\nJarvis: '+r.reply+'\n\nLesson: '+r.lesson:'Waiting for the first answer.'}setInterval(refresh,2000);refresh();</script>
