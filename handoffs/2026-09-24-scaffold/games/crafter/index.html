<!doctype html><meta charset="utf-8"><title>Jarvis · Crafter</title><style>body{background:#0c1421;color:#e8f2ff;font:18px system-ui;max-width:1000px;margin:35px auto;padding:20px}h1{color:#7ce5cc}main{display:flex;gap:30px;flex-wrap:wrap}img{width:500px;image-rendering:pixelated;border-radius:12px}pre{white-space:pre-wrap;font:16px system-ui;max-width:420px}button{padding:12px 22px;background:#243a50;color:white;border:1px solid #52738b;border-radius:8px;margin:5px}small{color:#a8bcd2}</style><h1>Jarvis’s Crafter sandbox</h1><p>Explore · Gather · Craft · Survive</p><main><img id="view"><pre id="state">Connecting…</pre></main><button onclick="act('pause')">Pause</button><button onclick="act('resume')">Resume</button><button onclick="act('stop')">Stop for tonight</button><p><small>Local, private, CPU game simulation. Game-specific strategy learning and recorded experience. Nothing purchased or published.</small></p><script>async function act(a){await fetch('/'+a,{method:'POST'})}async function update(){try{let s=await(await fetch('/state')).json();document.querySelector('#view').src='/frame?'+Date.now();document.querySelector('#state').textContent=(s.paused?'Paused':'Playing')+' · episode '+s.episode+'\nCurrent action: '+s.action+'\nPosition: '+s.position+'\nGoal: '+s.goal+'\nJarvis: '+s.jarvis_reason+'\n\nVerified moves: '+s.verified_moves+'\nInventory changes: '+s.inventory_changes+'\nSteps: '+s.total_steps+'\nStops at: '+s.stops_at+'\n\nAchievements\n'+s.achievements.join('\n')+'\n\nInventory\n'+JSON.stringify(s.inventory,null,2)}catch(e){document.querySelector('#state').textContent='Session stopped or temporarily unavailable. Saved results are in outputs/crafter.'}}setInterval(update,1500);update();</script>
